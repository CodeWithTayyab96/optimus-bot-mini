name: CI

# Runs the project's own test suite (`npm test` → scripts/run-tests.js) on every
# push and pull request. That suite is offline-safe: the smoke tests stub axios,
# so no API keys or .env are required, and settings.js is committed with
# placeholders. The live AI test (smoke-ai-live.js) is opt-in and NOT included.
#
# Node 20 is the floor, not 18: @whiskeysockets/baileys 7.x declares
# `engines.node >= 20.0.0`, so an 18 job would fail on install/runtime.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --legacy-peer-deps mirrors the project's own `install:panel` script;
      # sharp is an auto-installed peer of baileys and is present in the lockfile.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      # Syntax-checks every project JS file, then runs the help-coverage check
      # and all 24 smoke suites. Exits non-zero on any failure.
      - name: Run test suite
        run: npm test
